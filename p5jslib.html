<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.10.0/p5.min.js"></script>
<script>
  /* global p5 */
  const sketch = (p) => {
    p.setup = () => {
      p.createCanvas(800, 800)
      p.background('hsl(330, 100%, 50%)')
    }

    p.draw = () => {
      p.fill('hsl(330, 91%, 63%)')
      p.rect(p.mouseX, p.mouseY, 50, 50)
    }
  }
  new p5(sketch)
</script>
